
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">

  <meta
    name="description"
    content="Stellaphonicへのお問い合わせ。ご質問、ご意見、不具合のご報告などを受け付けています。"
  >

  <title>お問い合わせ | Stellaphonic</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --surface: #151e34;
      --border: rgba(176, 198, 255, 0.17);
      --text: #f5f7ff;
      --muted: #aab6d0;
      --accent: #a7c3ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          ellipse at top,
          #23355f 0%,
          #0b1020 60%
        );
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      line-height: 1.75;
    }

    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: white;
      animation: twinkle 5s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.15;
      }

      50% {
        opacity: 0.85;
      }
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(100% - 32px, 820px);
      margin: 0 auto;
    }

    header {
      padding: 30px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--accent);
      font-size: 26px;
    }

    main {
      padding: 40px 0 65px;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
    }

    h1 {
      margin: 12px 0 16px;
      font-size: clamp(30px, 5vw, 42px);
      letter-spacing: 0.04em;
    }

    .intro p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .card {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(21, 30, 52, 0.9);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.2);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .description {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .form-container {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #fff;
    }

    .form-container iframe {
      display: block;
      width: 100%;
      height: 650px;
      border: none;
      background: #fff;
    }

    .form-help {
      margin: 20px 0 0;
      text-align: center;
    }

    .form-help p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .button {
      display: inline-block;
      padding: 12px 22px;
      border: 1px solid rgba(167, 195, 255, 0.35);
      border-radius: 11px;
      background: rgba(167, 195, 255, 0.1);
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .button:hover {
      background: rgba(167, 195, 255, 0.19);
      border-color: var(--accent);
    }

    .mail-section {
      margin-top: 32px;
      text-align: center;
    }

    .mail-section p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .mail-link {
      color: var(--accent);
      font-weight: 600;
      overflow-wrap: anywhere;
      text-underline-offset: 4px;
    }

    footer {
      position: relative;
      z-index: 1;
      padding: 25px 0 35px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 0;
      }

      main {
        padding: 25px 0 50px;
      }

      .card {
        padding: 20px 12px;
        border-radius: 16px;
      }

      h2,
      .description {
        margin-left: 6px;
        margin-right: 6px;
      }

      .form-container iframe {
        height: 750px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .star {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div class="stars" id="stars" aria-hidden="true"></div>

  <div class="container">

    <header>
      <a class="brand" href="./">
        <span class="brand-icon" aria-hidden="true">✦</span>
        <span>Stellaphonic</span>
      </a>
    </header>

    <main>

      <section class="intro">
        <div class="eyebrow">CONTACT</div>

        <h1>お問い合わせ</h1>

        <p>
          Stellaphonicに関するご質問やご意見、<br>
          不具合のご報告などをお寄せください。
        </p>
      </section>

      <section class="card">

        <h2>お問い合わせフォーム</h2>

        <p class="description">
          以下のフォームからお問い合わせいただけます。
        </p>

        <!-- Googleフォーム埋め込み -->
        <div class="form-container">

          <iframe
            title="Stellaphonic お問い合わせフォーム"
            src="https://docs.google.com/forms/d/e/1FAIpQLSfeFCy4HIH8j2n1oY_CmeIjebS41Q2X7hcZwINOB5U0KwOaZA/viewform?embedded=true"
            width="100%"
            height="650"
            frameborder="0"
            marginheight="0"
            marginwidth="0"
          >
            読み込んでいます…
          </iframe>

        </div>

        <!-- 埋め込みが使えない環境向け -->
        <div class="form-help">

          <p>
            フォームが表示されない場合は、<br>
            以下のボタンから直接開いてください。
          </p>

          <a
            class="button"
            href="https://docs.google.com/forms/d/e/1FAIpQLSfeFCy4HIH8j2n1oY_CmeIjebS41Q2X7hcZwINOB5U0KwOaZA/viewform"
            target="_blank"
            rel="noopener noreferrer"
          >
            Googleフォームを直接開く ↗
          </a>

        </div>

      </section>

      <section class="mail-section">

        <p>メールでのお問い合わせはこちら</p>

        <a
          class="mail-link"
          href="mailto:sou.ok.0217@gmail.com"
        >
          sou.ok.0217@gmail.com
        </a>

      </section>

    </main>

  </div>

  <footer>
    <div class="container">
      &copy; <span id="year"></span> Stellaphonic.
      All rights reserved.
    </div>
  </footer>

  <script>
    // フッターの年を自動更新
    document.getElementById("year").textContent =
      new Date().getFullYear();

    // 背景の星を生成
    const starsContainer =
      document.getElementById("stars");

    const fragment =
      document.createDocumentFragment();

    for (let i = 0; i < 75; i++) {
      const star = document.createElement("span");

      star.className = "star";

      star.style.left =
        Math.random() * 100 + "%";

      star.style.top =
        Math.random() * 100 + "%";

      const size = 1 + Math.random() * 2;

      star.style.width = size + "px";
      star.style.height = size + "px";

      star.style.animationDelay =
        Math.random() * 5 + "s";

      fragment.appendChild(star);
    }

    starsContainer.appendChild(fragment);
  </script>

</body>
</html>
